name: Release

on:
  push:
    branches:
      - main
      - "release/v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run verify

      - uses: changesets/action@v1
        with:
          version: npm exec -- changeset version
          publish: node scripts/publish.mjs
          title: "chore: version packages (${{ github.ref_name }})"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
