<text x="40" y="52" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start" class="title">One Plan, one Row per payment</text><text x="40" y="82" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start" class="sub">A pool transaction pays one public account, so each recipient gets its own Row, withdrawal, and date.</text><rect x="40" y="160" width="170" height="130" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="54" y="190" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">Depositor</text><text x="54" y="216" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">Stellar account</text><text x="54" y="241" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">G…DEPO</text><path d="M210,225 L256,225" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-deposit)"/><rect x="260" y="140" width="200" height="170" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><path d="M261,174 L261,152 Q261,141 272,141 L448,141 Q459,141 459,152 L459,174 z" fill="#2563EB"/><text x="274" y="163" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Row 1 · Deposit</text><text x="274" y="202" font-size="15" font-weight="700" fill="#1E3A8A" text-anchor="start">Initial Deposit</text><text x="274" y="227" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="start">90 USDC in</text><text x="274" y="259" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">Day 0</text><path d="M460,225 L486,225" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-neutral)"/><rect x="490" y="140" width="200" height="170" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><path d="M491,174 L491,152 Q491,141 502,141 L678,141 Q689,141 689,152 L689,174 z" fill="#0D9488"/><text x="504" y="163" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Row 2 · Payout</text><text x="504" y="202" font-size="15" font-weight="700" fill="#134E4A" text-anchor="start">Payout to Bob</text><text x="504" y="227" font-size="22" font-weight="700" fill="#134E4A" text-anchor="start">30 USDC out</text><text x="504" y="259" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">Day 7</text><path d="M690,225 L716,225" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-neutral)"/><path d="M590,310 L590,366" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-payout)"/><text x="600" y="343" font-size="13" font-weight="600" fill="#0D9488" text-anchor="start">withdrawal</text><rect x="505" y="370" width="170" height="40" rx="9" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><text x="519" y="395" font-size="15" font-weight="600" fill="#134E4A" text-anchor="start">Bob's account · +30</text><rect x="720" y="140" width="200" height="170" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><path d="M721,174 L721,152 Q721,141 732,141 L908,141 Q919,141 919,152 L919,174 z" fill="#0D9488"/><text x="734" y="163" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Row 3 · Payout</text><text x="734" y="202" font-size="15" font-weight="700" fill="#134E4A" text-anchor="start">Payout to Carol</text><text x="734" y="227" font-size="22" font-weight="700" fill="#134E4A" text-anchor="start">20 USDC out</text><text x="734" y="259" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">Day 14</text><path d="M920,225 L946,225" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-neutral)"/><path d="M820,310 L820,366" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-payout)"/><text x="830" y="343" font-size="13" font-weight="600" fill="#0D9488" text-anchor="start">withdrawal</text><rect x="735" y="370" width="170" height="40" rx="9" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><text x="749" y="395" font-size="15" font-weight="600" fill="#134E4A" text-anchor="start">Carol's account · +20</text><rect x="950" y="140" width="200" height="170" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><path d="M951,174 L951,152 Q951,141 962,141 L1138,141 Q1149,141 1149,152 L1149,174 z" fill="#0D9488"/><text x="964" y="163" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Row 4 · Payout</text><text x="964" y="202" font-size="15" font-weight="700" fill="#134E4A" text-anchor="start">Payout to Dave</text><text x="964" y="227" font-size="22" font-weight="700" fill="#134E4A" text-anchor="start">40 USDC out</text><text x="964" y="259" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">Day 21</text><path d="M1050,310 L1050,366" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-payout)"/><text x="1060" y="343" font-size="13" font-weight="600" fill="#0D9488" text-anchor="start">withdrawal</text><rect x="965" y="370" width="170" height="40" rx="9" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><text x="979" y="395" font-size="15" font-weight="600" fill="#134E4A" text-anchor="start">Dave's account · +40</text><text x="40" y="445" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start" class="foot">Rows run in order. The service waits for each Step’s interval before it runs the next one.</text>
</svg>