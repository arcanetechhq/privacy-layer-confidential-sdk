<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
<defs><marker id="arrow-deposit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrow-payout" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrow-remainder" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CBD5E1"/></marker>
<style>
text { font-family: Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
.title { font-size: 26px; font-weight: 700; fill: #0F172A; }
.sub { font-size: 16px; fill: #475569; }
.lane { font-size: 16px; font-weight: 700; fill: #0F172A; }
.foot { font-size: 15px; fill: #475569; }
</style></defs>
<rect x="1" y="1" width="1198" height="468" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<text x="40" y="52" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start" class="title">A payout note can only pay its recipient</text><text x="40" y="82" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start" class="sub">The note is locked to one account, one asset, and one amount. The pool checks the lock on withdrawal.</text><rect x="40" y="150" width="400" height="220" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><path d="M41,184 L41,162 Q41,151 52,151 L428,151 Q439,151 439,162 L439,184 z" fill="#0D9488"/><text x="54" y="173" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Payout note</text><text x="54" y="212" font-size="26" font-weight="700" fill="#134E4A" text-anchor="start">30 USDC</text><text x="54" y="248" font-size="15" font-weight="700" fill="#134E4A" text-anchor="start">Locked to:</text><text x="54" y="273" font-size="15" font-weight="400" fill="#134E4A" text-anchor="start">Bob’s account G…BOB</text><text x="54" y="298" font-size="15" font-weight="400" fill="#134E4A" text-anchor="start">30 USDC, paid out in public</text><rect x="560" y="120" width="600" height="120" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="574" y="150" font-size="17" font-weight="700" fill="#14532D" text-anchor="start">Withdraw 30 USDC to Bob (G…BOB)</text><text x="574" y="177" font-size="15" font-weight="600" fill="#14532D" text-anchor="start">Pool accepts. Bob receives 30 USDC.</text><text x="1140" y="156" font-size="28" font-weight="700" fill="#16A34A" text-anchor="end">✓</text><rect x="560" y="290" width="600" height="120" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/><text x="574" y="320" font-size="17" font-weight="700" fill="#7F1D1D" text-anchor="start">Withdraw 30 USDC to Eve (G…EVE)</text><text x="574" y="347" font-size="15" font-weight="600" fill="#7F1D1D" text-anchor="start">Pool rejects. The tokens do not move.</text><text x="1140" y="326" font-size="28" font-weight="700" fill="#DC2626" text-anchor="end">✕</text><path d="M440,230 L556,180" fill="none" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrow-ok)"/><path d="M440,300 L556,350" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-bad)"/><text x="40" y="445" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start" class="foot">A withdrawal of a different amount or a different asset is rejected the same way.</text>
</svg>