<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<defs><marker id="arrow-deposit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrow-payout" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="arrow-remainder" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CBD5E1"/></marker>
<style>
text { font-family: Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
.title { font-size: 26px; font-weight: 700; fill: #0F172A; }
.sub { font-size: 16px; fill: #475569; }
.lane { font-size: 16px; font-weight: 700; fill: #0F172A; }
.foot { font-size: 15px; fill: #475569; }
</style></defs>
<rect x="1" y="1" width="1198" height="518" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<text x="40" y="52" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start" class="title">A Remainder carries value to the next Step</text><text x="40" y="82" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start" class="sub">A Step can create only a few notes. The value it does not pay out yet moves on as a Remainder.</text><rect x="40" y="120" width="470" height="330" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><path d="M41,154 L41,132 Q41,121 52,121 L498,121 Q509,121 509,132 L509,154 z" fill="#2563EB"/><text x="54" y="143" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Step 1 · Initial Deposit</text><text x="60" y="178" font-size="12" font-weight="700" fill="#64748B" text-anchor="start">IN</text><rect x="60" y="188" width="430" height="40" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="74" y="213" font-size="15" font-weight="600" fill="#1E3A8A" text-anchor="start">From the depositor’s account · 100 USDC</text><text x="60" y="256" font-size="12" font-weight="700" fill="#64748B" text-anchor="start">OUT</text><rect x="60" y="266" width="430" height="40" rx="9" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><text x="74" y="291" font-size="15" font-weight="600" fill="#134E4A" text-anchor="start">Note for Bob · 30 USDC</text><rect x="60" y="316" width="430" height="40" rx="9" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><text x="74" y="341" font-size="15" font-weight="600" fill="#134E4A" text-anchor="start">Note for Carol · 20 USDC</text><rect x="60" y="366" width="430" height="40" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><text x="74" y="391" font-size="15" font-weight="600" fill="#78350F" text-anchor="start">Remainder · 50 USDC</text><rect x="690" y="120" width="470" height="330" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><path d="M691,154 L691,132 Q691,121 702,121 L1148,121 Q1159,121 1159,132 L1159,154 z" fill="#64748B"/><text x="704" y="143" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Step 2 · Transfer</text><text x="710" y="178" font-size="12" font-weight="700" fill="#64748B" text-anchor="start">IN</text><rect x="710" y="188" width="430" height="40" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><text x="724" y="213" font-size="15" font-weight="600" fill="#78350F" text-anchor="start">Remainder · 50 USDC</text><text x="710" y="256" font-size="12" font-weight="700" fill="#64748B" text-anchor="start">OUT</text><rect x="710" y="266" width="430" height="40" rx="9" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><text x="724" y="291" font-size="15" font-weight="600" fill="#134E4A" text-anchor="start">Note for Dave · 25 USDC</text><rect x="710" y="316" width="430" height="40" rx="9" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><text x="724" y="341" font-size="15" font-weight="600" fill="#134E4A" text-anchor="start">Note for Erin · 25 USDC</text><path d="M490,386 C638,386 558,208 706,208" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-remainder)"/><text x="600" y="320" font-size="13" font-weight="700" fill="#D97706" text-anchor="middle">spent by</text><text x="600" y="338" font-size="13" font-weight="700" fill="#D97706" text-anchor="middle">the next Step</text><text x="40" y="490" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start" class="foot">Each payout note is then withdrawn to its recipient’s account in its own withdrawal Step.</text>
</svg>