<text x="40" y="52" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start" class="title">Free tokens pay the fee</text><text x="40" y="82" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start" class="sub">The Plan reserves Free tokens on every Step. The fee is quoted when the Step runs and is paid from them.</text><rect x="40" y="120" width="500" height="360" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><path d="M41,154 L41,132 Q41,121 52,121 L528,121 Q539,121 539,132 L539,154 z" fill="#64748B"/><text x="54" y="143" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">In the Plan · Step 2 · Transfer</text><text x="60" y="178" font-size="12" font-weight="700" fill="#64748B" text-anchor="start">IN</text><rect x="60" y="188" width="460" height="40" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><text x="74" y="213" font-size="15" font-weight="600" fill="#78350F" text-anchor="start">Remainder · 52 USDC</text><text x="60" y="256" font-size="12" font-weight="700" fill="#64748B" text-anchor="start">OUT</text><rect x="60" y="266" width="460" height="40" rx="9" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><text x="74" y="291" font-size="15" font-weight="600" fill="#134E4A" text-anchor="start">Note for Dave · 25 USDC</text><rect x="60" y="316" width="460" height="40" rx="9" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><text x="74" y="341" font-size="15" font-weight="600" fill="#134E4A" text-anchor="start">Note for Erin · 25 USDC</text><rect x="60" y="366" width="460" height="40" rx="9" fill="#F8FAFC" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5"/><text x="74" y="391" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start">Free tokens · 2 USDC</text><text x="60" y="450" font-size="15" font-weight="600" fill="#334155" text-anchor="start">52 = 25 + 25 + 2. The fee is not a line in the Plan.</text><rect x="660" y="120" width="500" height="360" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><path d="M661,154 L661,132 Q661,121 672,121 L1148,121 Q1159,121 1159,132 L1159,154 z" fill="#64748B"/><text x="674" y="143" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">When the Step runs</text><text x="680" y="178" font-size="12" font-weight="700" fill="#64748B" text-anchor="start">QUOTE</text><rect x="680" y="188" width="460" height="40" rx="9" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="694" y="213" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start">Fee quote at run time · 1.5 USDC</text><text x="680" y="256" font-size="12" font-weight="700" fill="#64748B" text-anchor="start">OUT</text><rect x="680" y="266" width="460" height="40" rx="9" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><text x="694" y="291" font-size="15" font-weight="600" fill="#134E4A" text-anchor="start">Note for Dave · 25 USDC (unchanged)</text><rect x="680" y="316" width="460" height="40" rx="9" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><text x="694" y="341" font-size="15" font-weight="600" fill="#134E4A" text-anchor="start">Note for Erin · 25 USDC (unchanged)</text><rect x="680" y="366" width="460" height="40" rx="9" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="694" y="391" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start">Fee · 1.5 USDC → fee collector</text><rect x="680" y="416" width="460" height="40" rx="9" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="694" y="441" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start">Unused · 0.5 USDC → kept by the service</text><path d="M520,386 C618,386 578,410 676,410" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-neutral)"/><text x="40" y="520" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start" class="foot">If the quote is above the Free tokens, the Step does not run. Raise the Free tokens before you sign the Deposit.</text>
</svg>