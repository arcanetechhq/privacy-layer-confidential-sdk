<rect x="1" y="1" width="1198" height="558" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<text x="40" y="52" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start" class="title">Fix an underfunded Plan with an intermediate Deposit</text><text x="40" y="82" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start" class="sub">Each Deposit funds the Payouts after it, up to the next Deposit.</text><text x="40" y="138" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start" class="lane">Underfunded</text><rect x="160" y="118" width="343.79999999999995" height="28" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/><text x="331.9" y="137" font-size="14" font-weight="700" fill="#7F1D1D" text-anchor="middle">Dave’s Payout has nothing left to spend</text><rect x="40" y="160" width="200" height="120" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><path d="M41,194 L41,172 Q41,161 52,161 L228,161 Q239,161 239,172 L239,194 z" fill="#2563EB"/><text x="54" y="183" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Deposit</text><text x="54" y="222" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="start">50 USDC in</text><text x="54" y="252" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">Day 0</text><rect x="270" y="160" width="200" height="120" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><path d="M271,194 L271,172 Q271,161 282,161 L458,161 Q469,161 469,172 L469,194 z" fill="#0D9488"/><text x="284" y="183" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Payout to Bob</text><text x="284" y="222" font-size="20" font-weight="700" fill="#134E4A" text-anchor="start">30 USDC out</text><text x="284" y="252" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">20 left</text><rect x="500" y="160" width="200" height="120" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><path d="M501,194 L501,172 Q501,161 512,161 L688,161 Q699,161 699,172 L699,194 z" fill="#0D9488"/><text x="514" y="183" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Payout to Carol</text><text x="514" y="222" font-size="20" font-weight="700" fill="#134E4A" text-anchor="start">20 USDC out</text><text x="514" y="252" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">0 left</text><rect x="730" y="160" width="200" height="120" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="7 6"/><path d="M731,194 L731,172 Q731,161 742,161 L918,161 Q929,161 929,172 L929,194 z" fill="none"/><text x="744" y="183" font-size="14" font-weight="700" fill="#94A3B8" text-anchor="start">No Deposit here</text><text x="744" y="222" font-size="1" font-weight="400" fill="#94A3B8" text-anchor="start"></text><rect x="960" y="160" width="200" height="120" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/><path d="M961,194 L961,172 Q961,161 972,161 L1148,161 Q1159,161 1159,172 L1159,194 z" fill="#DC2626"/><text x="974" y="183" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Payout to Dave</text><text x="974" y="222" font-size="20" font-weight="700" fill="#7F1D1D" text-anchor="start">40 USDC out</text><text x="974" y="252" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="start">Underfunded: needs 40</text><path d="M240,220 L266,220" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-neutral)"/><path d="M470,220 L496,220" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-neutral)"/><path d="M700,220 L726,220" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-neutral)"/><path d="M930,220 L956,220" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-neutral)"/><text x="40" y="348" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start" class="lane">Funded</text><rect x="120" y="328" width="335.59999999999997" height="28" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/><text x="287.79999999999995" y="347" font-size="14" font-weight="700" fill="#14532D" text-anchor="middle">A second Deposit brings the missing 40</text><rect x="40" y="370" width="200" height="120" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><path d="M41,404 L41,382 Q41,371 52,371 L228,371 Q239,371 239,382 L239,404 z" fill="#2563EB"/><text x="54" y="393" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Deposit</text><text x="54" y="432" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="start">50 USDC in</text><text x="54" y="462" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">Day 0</text><rect x="270" y="370" width="200" height="120" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><path d="M271,404 L271,382 Q271,371 282,371 L458,371 Q469,371 469,382 L469,404 z" fill="#0D9488"/><text x="284" y="393" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Payout to Bob</text><text x="284" y="432" font-size="20" font-weight="700" fill="#134E4A" text-anchor="start">30 USDC out</text><text x="284" y="462" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">20 left</text><rect x="500" y="370" width="200" height="120" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><path d="M501,404 L501,382 Q501,371 512,371 L688,371 Q699,371 699,382 L699,404 z" fill="#0D9488"/><text x="514" y="393" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Payout to Carol</text><text x="514" y="432" font-size="20" font-weight="700" fill="#134E4A" text-anchor="start">20 USDC out</text><text x="514" y="462" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">0 left</text><rect x="730" y="370" width="200" height="120" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><path d="M731,404 L731,382 Q731,371 742,371 L918,371 Q929,371 929,382 L929,404 z" fill="#2563EB"/><text x="744" y="393" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Intermediate Deposit</text><text x="744" y="432" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="start">40 USDC in</text><text x="744" y="462" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">40 left</text><rect x="960" y="370" width="200" height="120" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><path d="M961,404 L961,382 Q961,371 972,371 L1148,371 Q1159,371 1159,382 L1159,404 z" fill="#16A34A"/><text x="974" y="393" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Payout to Dave</text><text x="974" y="432" font-size="20" font-weight="700" fill="#14532D" text-anchor="start">40 USDC out</text><text x="974" y="462" font-size="15" font-weight="700" fill="#14532D" text-anchor="start">Funded</text><path d="M240,430 L266,430" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-neutral)"/><path d="M470,430 L496,430" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-neutral)"/><path d="M700,430 L726,430" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-neutral)"/><path d="M930,430 L956,430" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-neutral)"/><text x="40" y="535" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start" class="foot">Free tokens are left out of this example. In a real Plan, each Deposit also covers the Free tokens of the Steps it funds.</text>
</svg>